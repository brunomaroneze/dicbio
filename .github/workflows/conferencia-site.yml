name: Publicar tela de conferência
on:
  push:
    branches: [main]
    paths:
      - 'corpus_digital/obras/*.xml'
      - 'revisao/**'
      - '.github/workflows/conferencia-site.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    if: github.repository == 'brunomaroneze/dicbio'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 revisao/gerar_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: revisao/_site
      - id: deploy
        uses: actions/deploy-pages@v4
